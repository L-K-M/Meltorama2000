# Release: a pushed v* tag builds, verifies, and publishes the release APK and
# the universal native Mac zip.
#
# Signing: BOTH build types are signed with the checked-in app/debug.keystore —
# zero secrets, reproducible by anyone, deliberately sideload-only
# (docs/decisions/0002). Switching to a real key later breaks upgrades for
# every installed user, which is why this was decided on day one.
#
# Hardening (family contract): least-privilege permissions, no cancellation
# (a half-cancelled publish is worse than a slow one), timeout, wrapper
# validation before any Gradle execution, and a tag↔versionName gate so a tag
# can only publish the version the commit actually declares.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The committed versionName at the tagged commit is the source of truth;
      # the tag only names the Release. Same sed pattern scripts/release.sh's
      # engine writes with, so this gate accepts everything the bumper produces.
      - name: Verify tag matches committed versionName
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMITTED="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]*)".*$/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "$VERSION" != "$COMMITTED" ]; then
            echo "!! tag v$VERSION does not match committed versionName $COMMITTED" >&2
            echo "!! re-cut the release with scripts/release.sh" >&2
            exit 1
          fi

      # Re-prove the tagged commit: a tag can land on a commit CI never saw.
      # Same license statement checks as ci.yml.
      - name: Check license statements
        run: |
          status=0
          grep -q 'own code is public domain (Unlicense)' app/src/main/res/values/strings.xml \
            || { echo "::error file=app/src/main/res/values/strings.xml::about_body must scope the Unlicense to the app's own code"; status=1; }
          grep -q '自身的代码属于公共领域（Unlicense）' app/src/main/res/values-b+zh+Hans/strings.xml \
            || { echo "::error file=app/src/main/res/values-b+zh+Hans/strings.xml::about_body must scope the Unlicense to the app's own code"; status=1; }
          grep -q 'Open-source licenses' macos/THIRD_PARTY_NOTICES.txt \
            || { echo "::error file=macos/THIRD_PARTY_NOTICES.txt::must say where the Android notices ship"; status=1; }
          { grep -q 'THIRD_PARTY_NOTICES.txt' README.md && grep -q 'Open-source licenses' README.md; } \
            || { echo "::error file=README.md::the License section must say where the third-party notices ship"; status=1; }
          exit "$status"

      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      # The APK we publish must carry its third-party notices (see ci.yml).
      # R8 may shorten res/raw/aboutlibraries.json's path; `check` finds it.
      - name: Check third-party notices in the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          python3 -I scripts/android_notices.py check "$APK" --config android-notices.toml
          python3 -I scripts/android_notices.py scan "$APK" --config android-notices.toml \
            --fetch-from https://dl.google.com/dl/android/maven2 \
            --fetch-from https://repo.maven.apache.org/maven2

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/meltorama-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "meltorama-${GITHUB_REF_NAME}.apk" > "meltorama-${GITHUB_REF_NAME}.apk.sha256")

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meltorama-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The Mac zip comes from the tagged commit through the same checks as CI,
  # not from a hand upload, so the published bytes are the verified ones.
  macos:
    name: Build release Mac app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify shared shaders and native tests
        run: scripts/test-macos.sh

      - name: Build universal Mac application
        run: scripts/build-macos.sh --universal

      # Same notice checks as ci.yml, on the zip that gets published.
      - name: Check notices in the native application
        run: |
          RES=Meltorama.app/Contents/Resources
          test -s "dist/$RES/LICENSE"
          test -s "dist/$RES/THIRD_PARTY_NOTICES.txt"
          for zip in dist/meltorama-*-macos-*.zip; do
            unzip -p "$zip" "$RES/LICENSE" | grep -q 'released into the public domain'
            unzip -p "$zip" "$RES/THIRD_PARTY_NOTICES.txt" | grep -q 'no third-party runtime libraries'
          done

      - name: Upload verified Mac zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meltorama-release-macos-${{ github.sha }}
          path: |
            dist/meltorama-*-macos-*.zip
            dist/meltorama-*-macos-*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [build, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meltorama-release-${{ github.sha }}
          path: dist

      - name: Download verified Mac zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meltorama-release-macos-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Display name, so it is the product name — "Meltorama", matching
          # RELEASE_APP_NAME in scripts/release.sh and the APK filenames
          # above. Not "Meltorama 2000": the model number next to a version
          # number reads as two versions.
          name: Meltorama ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.zip
            dist/*.sha256
