# CI: prove every push to main and every PR — unit tests, Android lint, and a
# debug APK and native Mac app uploaded as rolling artifacts.
#
# Hardening (family contract):
#   - least-privilege token (contents: read)
#   - cancel superseded PR runs, but never an in-progress main run — a
#     permanently "cancelled" main commit masks breakage and breaks bisection
#   - timeout on every job so a wedged Gradle daemon can't burn runner hours

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # License statements must agree with LICENSE (the Unlicense) and scope it
      # to Meltorama's own code: one check per statement that has been wrong.
      - name: Check license statements
        run: |
          status=0
          grep 'name="about_body"' app/src/main/res/values/strings.xml | grep -q 'own code is public domain (Unlicense)' \
            || { echo "::error file=app/src/main/res/values/strings.xml::about_body must scope the Unlicense to the app's own code"; status=1; }
          grep 'name="about_body"' app/src/main/res/values-b+zh+Hans/strings.xml | grep -q '自身的代码属于公共领域（Unlicense）' \
            || { echo "::error file=app/src/main/res/values-b+zh+Hans/strings.xml::about_body must scope the Unlicense to the app's own code"; status=1; }
          grep -q 'Open-source licenses' macos/THIRD_PARTY_NOTICES.txt \
            || { echo "::error file=macos/THIRD_PARTY_NOTICES.txt::must say where the Android notices ship"; status=1; }
          { grep -q 'THIRD_PARTY_NOTICES.txt' README.md && grep -q 'Open-source licenses' README.md; } \
            || { echo "::error file=README.md::the License section must say where the third-party notices ship"; status=1; }
          exit "$status"

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # No explicit SDK install step: the ubuntu runner image ships the Android
      # SDK, and AGP resolves compileSdk android-37.0 against it (paired with
      # android.suppressUnsupportedCompileSdk in gradle.properties).
      - uses: gradle/actions/setup-gradle@v5

      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # The APK must carry its third-party notices: AboutLibraries definitions
      # with every component's license text, a claim for every native library
      # (android-notices.toml), and the NOTICE files the resolved AARs and jars
      # embed. `scan` reads those from the Gradle cache, so it runs in the job
      # that built the APK.
      - name: Check third-party notices in the APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 -I scripts/android_notices.py check "$APK" --config android-notices.toml
          python3 -I scripts/android_notices.py scan "$APK" --config android-notices.toml \
            --fetch-from https://dl.google.com/dl/android/maven2 \
            --fetch-from https://repo.maven.apache.org/maven2

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: goo-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verify shared shaders and native tests
        run: scripts/test-macos.sh

      - name: Verify build and installation commands
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Build independent native application
        run: scripts/build-macos.sh --universal

      # The app and the zip must carry LICENSE and THIRD_PARTY_NOTICES.txt;
      # build-macos.sh copies them, but cp accepts an empty file.
      - name: Check notices in the native application
        run: |
          RES=Meltorama.app/Contents/Resources
          test -s "dist/$RES/LICENSE"
          test -s "dist/$RES/THIRD_PARTY_NOTICES.txt"
          for zip in dist/meltorama-*-macos-*.zip; do
            unzip -p "$zip" "$RES/LICENSE" | grep -q 'released into the public domain'
            unzip -p "$zip" "$RES/THIRD_PARTY_NOTICES.txt" | grep -q 'no third-party runtime libraries'
          done

      - name: Upload native Mac application
        uses: actions/upload-artifact@v7
        with:
          name: meltorama-macos-${{ github.sha }}
          path: |
            dist/meltorama-*-macos-*.zip
            dist/meltorama-*-macos-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
